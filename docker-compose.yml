# `docker compose up -d`                 -> postgres only (local dev)
# `docker compose --profile app up -d --build` -> postgres + control-plane + platform
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aven}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aven}
      POSTGRES_DB: ${POSTGRES_DB:-aven}
    ports:
      - "${POSTGRES_PORT:-54329}:5432"
    volumes:
      - pg_data_aven:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  control-plane:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/control-plane/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8000
      DATABASE_URL: postgres://${POSTGRES_USER:-aven}:${POSTGRES_PASSWORD:-aven}@postgres:5432/${POSTGRES_DB:-aven}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:5173}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:5173}
    ports:
      - "${CONTROL_PLANE_PORT:-8000}:8000"

  platform:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/platform/Dockerfile
    restart: unless-stopped
    depends_on:
      - control-plane
    ports:
      - "${PLATFORM_PORT:-5173}:80"

volumes:
  pg_data_aven:

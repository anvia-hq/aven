<!doctype html><meta charset="utf-8" /><style>
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    background: transparent;
    font:
      13px/1.45 system-ui,
      sans-serif;
    color: var(--aven-foreground, #e6e8eb);
  }
  #root {
    padding: 16px;
    border-radius: 12px;
    --bg: #0d1117;
    --fg: #e6e8eb;
    --mut: #8b949e;
    --bd: #262c36;
    --card: #12171e;
  }
  #root.light {
    --bg: #fff;
    --fg: #14171a;
    --mut: #667085;
    --bd: #e3e6ea;
    --card: #f6f7f9;
  }
  #root {
    background: var(--bg);
    color: var(--fg);
  }
  h1 {
    font-size: 17px;
    margin: 0 0 4px;
  }
  h2 {
    font-size: 13px;
    margin: 20px 0 8px;
    color: var(--mut);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  p {
    margin: 0;
    color: var(--mut);
  }
  .bar {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin: 14px 0;
  }
  .seg {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .lbl {
    color: var(--mut);
    margin-right: 4px;
  }
  button {
    font: inherit;
    color: var(--fg);
    background: transparent;
    border: 1px solid var(--bd);
    border-radius: 999px;
    padding: 3px 11px;
    cursor: pointer;
  }
  button.on {
    background: var(--fg);
    color: var(--bg);
    border-color: var(--fg);
  }
  button.sw {
    width: 22px;
    height: 22px;
    padding: 0;
    border-radius: 50%;
  }
  button.sw.on {
    outline: 2px solid var(--fg);
    outline-offset: 2px;
  }
  .pair {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--bd);
    border-radius: 14px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .stage {
    display: flex;
    justify-content: center;
    padding: 6px 0;
  }
  .cv {
    color: var(--mut);
    display: block;
  }
  .projects {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .proj {
    display: grid;
    grid-template-columns: auto auto;
    gap: 6px 10px;
    justify-content: start;
    align-items: center;
    border-radius: 12px;
    padding: 8px 10px;
    background: var(--card);
  }
  .proj span {
    grid-column: 1/3;
    font-size: 11px;
    color: var(--mut);
  }
  .proj.picked {
    outline: 2px solid var(--fg);
  }
  .grab {
    cursor: grab;
    touch-action: none;
  }
  .grab:active {
    cursor: grabbing;
  }
  .meta p {
    font-size: 12px;
    margin-top: 2px;
  }
  .sizes {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 16px;
  }
  .hint {
    color: var(--mut);
    font-size: 11px;
    margin-left: auto;
  }
  .panel {
    background: var(--card);
    border: 1px solid var(--bd);
    border-radius: 12px;
    padding: 6px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 34px;
    padding: 0 8px;
    border-radius: 8px;
  }
  .row:nth-child(2) {
    background: color-mix(in oklab, var(--fg) 7%, transparent);
  }
  .row .tag {
    font-size: 11px;
    color: var(--mut);
    border: 1px solid var(--bd);
    border-radius: 999px;
    padding: 0 7px;
  }
  .row .st {
    margin-left: auto;
    color: var(--mut);
  }
  .life {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-top: 10px;
  }
  .step {
    background: var(--card);
    border: 1px solid var(--bd);
    border-radius: 14px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    text-align: center;
  }
  .step small {
    color: var(--mut);
    font-size: 11px;
  }
  @media (max-width: 640px) {
    .pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .life {
      grid-template-columns: repeat(2, 1fr);
    }
  }

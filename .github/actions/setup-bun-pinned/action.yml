name: Setup pinned Bun canary
description: Install and cache an exact immutable Bun canary release from the npm registry.

inputs:
  version:
    description: Exact Bun version (for example 1.4.5-canary.20261120.1)
    required: true

runs:
  using: composite
  steps:
    - name: Install Bun ${{ inputs.version }}
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.bun/bin"
        if [ ! -f "$HOME/.bun/bin/.version-${{ inputs.version }}" ]; then
          curl -fsSL "https://registry.npmjs.org/@oven/bun-linux-x64/-/bun-linux-x64-${{ inputs.version }}.tgz" \
            | tar -xz -C "$HOME/.bun/bin" --strip-components=2 package/bin/bun
          chmod +x "$HOME/.bun/bin/bun"
          ln -sf "$HOME/.bun/bin/bun" "$HOME/.bun/bin/bunx"
          rm -f "$HOME/.bun/bin"/.version-*
          touch "$HOME/.bun/bin/.version-${{ inputs.version }}"
        fi
        echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
        "$HOME/.bun/bin/bun" --revision

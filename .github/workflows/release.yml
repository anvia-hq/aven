# Publishes a release when a version tag is pushed (decision 0073): the server, web and sandbox
# images for amd64 and arm64 on GHCR, then a GitHub Release. Each architecture builds on a native
# runner (the sandbox image compiles toolchains, which QEMU makes very slow), pushes by digest, and
# a merge job joins the digests into one multi-arch tag.
#
#   git tag v0.1.0 && git push origin v0.1.0
name: release

on:
  push:
    tags: ["v*"]

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build:
    name: build ${{ matrix.image }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              image: server,
              arch: amd64,
              runner: ubuntu-24.04,
              context: .,
              file: apps/control-plane/Dockerfile,
            }
          - {
              image: server,
              arch: arm64,
              runner: ubuntu-24.04-arm,
              context: .,
              file: apps/control-plane/Dockerfile,
            }
          - {
              image: web,
              arch: amd64,
              runner: ubuntu-24.04,
              context: .,
              file: apps/platform/Dockerfile,
            }
          - {
              image: web,
              arch: arm64,
              runner: ubuntu-24.04-arm,
              context: .,
              file: apps/platform/Dockerfile,
            }
          - {
              image: sandbox,
              arch: amd64,
              runner: ubuntu-24.04,
              context: apps/runtime/sandbox-image,
              file: apps/runtime/sandbox-image/Dockerfile,
            }
          - {
              image: sandbox,
              arch: arm64,
              runner: ubuntu-24.04-arm,
              context: apps/runtime/sandbox-image,
              file: apps/runtime/sandbox-image/Dockerfile,
            }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/aven-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
      - name: Keep the digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: publish ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [server, web, sandbox]
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-${{ matrix.image }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # v1.2.3 becomes 1.2.3 and 1.2; `latest` follows every tag that is not a prerelease.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/aven-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Join the architectures into one tag
        working-directory: ${{ runner.temp }}/digests
        run: |
          # The tag and digest lists are meant to split into one argument each.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/aven-${{ matrix.image }}@sha256:%s ' *)
      - name: Check the tag
        run: docker buildx imagetools inspect "${{ env.REGISTRY }}/aven-${{ matrix.image }}:${{ steps.meta.outputs.version }}"

  binaries:
    name: build the aven binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Build and pack for every platform
        run: apps/cli/scripts/build-release.sh "$GITHUB_REF_NAME" dist/release
      - uses: actions/upload-artifact@v7
        with:
          name: aven-binaries
          path: dist/release/*
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [merge, binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: aven-binaries
          path: release
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          # The release carries the binaries and their checksums; --verify-tag refuses a tag that was not pushed.
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes $prerelease

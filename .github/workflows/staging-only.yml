name: staging-only

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: staging-only-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  staging-only:
    name: main only takes staging
    runs-on: ubuntu-24.04
    steps:
      - name: Check the pull request's head branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$BASE_REF" = "main" ] && [ "$HEAD_REF" != "staging" ]; then
            echo "::error::main takes pull requests from staging only; this one comes from $HEAD_REF."
            exit 1
          fi

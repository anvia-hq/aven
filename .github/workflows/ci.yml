name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.5-canary.20261120.1

jobs:
  check:
    name: typecheck, lint, format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - uses: ./.github/actions/setup-bun-pinned
        with:
          version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        id: deps
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            sandbox/node_modules
          key: deps-${{ runner.os }}-bun${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: deps-${{ runner.os }}-bun${{ env.BUN_VERSION }}-
      - run: bun install --frozen-lockfile
        if: steps.deps.outputs.cache-hit != 'true'
      - name: Run typecheck, lint, format and platform build
        run: |
          failed=()
          run_check() {
            local label="$1"
            shift
            echo "::group::$label"
            if ! "$@"; then
              failed+=("$label")
            fi
            echo "::endgroup::"
          }
          run_check "typecheck" bun run typecheck
          run_check "lint" bun run lint
          run_check "format" bun run format:check
          run_check "platform build" bunx --cwd apps/platform vite build
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Failed checks: ${failed[*]}"
            exit 1
          fi

  test:
    name: unit tests ${{ matrix.shard }}/2
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/aven_template
      AVEN_TEST_DB_TEMPLATE: aven_template
      BETTER_AUTH_SECRET: ci-only-secret-of-at-least-thirty-two-characters
      BETTER_AUTH_URL: http://localhost:5173
      PROVIDER_ENCRYPTION_KEY: ZTJlLW9ubHktZW5jcnlwdGlvbi1rZXktMzJieXRlcyE=
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - uses: ./.github/actions/setup-bun-pinned
        with:
          version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        id: deps
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            sandbox/node_modules
          key: deps-${{ runner.os }}-bun${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: deps-${{ runner.os }}-bun${{ env.BUN_VERSION }}-
      - run: bun install --frozen-lockfile
        if: steps.deps.outputs.cache-hit != 'true'
      - uses: actions/cache/restore@v4
        with:
          path: .ci-timings/unit-timings.json
          key: unit-timings-${{ github.sha }}
          restore-keys: unit-timings-
      - name: Start Postgres
        run: |
          PG_CONF=$(find /etc/postgresql -name postgresql.conf | head -n 1)
          printf '\nfsync = off\nsynchronous_commit = off\nfull_page_writes = off\nmax_connections = 300\n' | sudo tee -a "$PG_CONF" >/dev/null
          sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER USER postgres WITH PASSWORD 'postgres';"
          sudo -u postgres createdb -O postgres aven_template
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: bun packages/db/src/migrate.ts
      - name: Run unit tests shard ${{ matrix.shard }}/2
        run: |
          mkdir -p .ci-timings
          if [ ! -f .ci-timings/unit-timings.json ]; then
            printf '{"version":1,"files":{}}\n' > .ci-timings/unit-timings.json
          fi
          bun test \
            --parallel=4 \
            --isolate \
            --preload ./tooling/ci/test-db-preload.ts \
            --shard=${{ matrix.shard }}/2 \
            --timings=.ci-timings/unit-timings.json \
            --update-timings \
            apps packages sandbox tooling
          cp .ci-timings/unit-timings.json .ci-timings/unit-timings-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-timings-${{ matrix.shard }}
          path: .ci-timings/unit-timings-${{ matrix.shard }}.json
          retention-days: 1

  unit-shards-verify:
    name: unit shards completeness
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - uses: ./.github/actions/setup-bun-pinned
        with:
          version: ${{ env.BUN_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          pattern: unit-timings-*
          path: .ci-timings
          merge-multiple: true
      - name: Prove shards ran every unit test file
        run: bun tooling/ci/verify-unit-shards.ts --out=.ci-timings/unit-timings.json .ci-timings/unit-timings-*.json
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main' || github.event_name == 'merge_group'
        with:
          path: .ci-timings/unit-timings.json
          key: unit-timings-${{ github.sha }}

  e2e:
    name: e2e ${{ matrix.shard }}/3
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/aven_e2e
      E2E_WORKERS: 4
      E2E_REPORT_FILE: .ci-timings/e2e-report-${{ matrix.shard }}.json
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - uses: ./.github/actions/setup-bun-pinned
        with:
          version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        id: deps
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            sandbox/node_modules
          key: deps-${{ runner.os }}-bun${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: deps-${{ runner.os }}-bun${{ env.BUN_VERSION }}-
      - run: bun install --frozen-lockfile
        if: steps.deps.outputs.cache-hit != 'true'
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-headless-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: playwright-headless-${{ runner.os }}-
      - run: bunx playwright install chromium-headless-shell
        if: steps.browsers.outputs.cache-hit != 'true'
      - uses: actions/cache/restore@v4
        with:
          path: .ci-timings/e2e-timings.json
          key: e2e-timings-${{ github.sha }}
          restore-keys: e2e-timings-
      - name: Start Postgres
        run: |
          PG_CONF=$(find /etc/postgresql -name postgresql.conf | head -n 1)
          printf '\nfsync = off\nsynchronous_commit = off\nfull_page_writes = off\n' | sudo tee -a "$PG_CONF" >/dev/null
          sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER USER postgres WITH PASSWORD 'postgres';"
      - name: Run e2e shard ${{ matrix.shard }}/3
        run: |
          mkdir -p .ci-timings
          mapfile -t specs < <(bun tooling/ci/e2e-shards.ts plan --shard=${{ matrix.shard }}/3 --timings=.ci-timings/e2e-timings.json)
          if [ ${#specs[@]} -eq 0 ]; then
            printf '{"suites":[]}\n' > "$E2E_REPORT_FILE"
            exit 0
          fi
          bun run test:e2e "${specs[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report-${{ matrix.shard }}
          path: .ci-timings/e2e-report-${{ matrix.shard }}.json
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: test-results
          retention-days: 7

  e2e-shards-verify:
    name: e2e shards completeness
    needs: e2e
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - uses: ./.github/actions/setup-bun-pinned
        with:
          version: ${{ env.BUN_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          pattern: e2e-report-*
          path: .ci-timings
          merge-multiple: true
      - name: Prove shards ran every e2e spec file
        run: bun tooling/ci/e2e-shards.ts verify --out=.ci-timings/e2e-timings.json .ci-timings/e2e-report-*.json
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main' || github.event_name == 'merge_group'
        with:
          path: .ci-timings/e2e-timings.json
          key: e2e-timings-${{ github.sha }}

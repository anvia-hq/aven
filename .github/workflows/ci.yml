name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.5

jobs:
  check:
    name: typecheck, lint, format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        id: deps
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            sandbox/node_modules
          key: deps-${{ runner.os }}-bun${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: deps-${{ runner.os }}-bun${{ env.BUN_VERSION }}-
      - run: bun install --frozen-lockfile
        if: steps.deps.outputs.cache-hit != 'true'
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check

  test:
    name: unit tests
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/aven
      BETTER_AUTH_SECRET: ci-only-secret-of-at-least-thirty-two-characters
      BETTER_AUTH_URL: http://localhost:5173
      PROVIDER_ENCRYPTION_KEY: ZTJlLW9ubHktZW5jcnlwdGlvbi1rZXktMzJieXRlcyE=
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        id: deps
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            sandbox/node_modules
          key: deps-${{ runner.os }}-bun${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: deps-${{ runner.os }}-bun${{ env.BUN_VERSION }}-
      - run: bun install --frozen-lockfile
        if: steps.deps.outputs.cache-hit != 'true'
      - name: Start Postgres
        run: |
          PG_CONF=$(find /etc/postgresql -name postgresql.conf | head -n 1)
          printf '\nfsync = off\nsynchronous_commit = off\nfull_page_writes = off\n' | sudo tee -a "$PG_CONF" >/dev/null
          sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER USER postgres WITH PASSWORD 'postgres';"
          sudo -u postgres createdb -O postgres aven
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: bun packages/db/src/migrate.ts
      - run: bun test apps packages sandbox tooling

  e2e:
    name: e2e ${{ matrix.shard }}/3
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/aven_e2e
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        id: deps
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            sandbox/node_modules
          key: deps-${{ runner.os }}-bun${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: deps-${{ runner.os }}-bun${{ env.BUN_VERSION }}-
      - run: bun install --frozen-lockfile
        if: steps.deps.outputs.cache-hit != 'true'
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-headless-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: playwright-headless-${{ runner.os }}-
      - run: bunx playwright install chromium-headless-shell
        if: steps.browsers.outputs.cache-hit != 'true'
      - name: Start Postgres
        run: |
          PG_CONF=$(find /etc/postgresql -name postgresql.conf | head -n 1)
          printf '\nfsync = off\nsynchronous_commit = off\nfull_page_writes = off\n' | sudo tee -a "$PG_CONF" >/dev/null
          sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER USER postgres WITH PASSWORD 'postgres';"
      - run: bun run test:e2e --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: test-results
          retention-days: 7

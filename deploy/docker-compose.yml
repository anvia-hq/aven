# Self-hosted Aven: Postgres, the control plane and the web entry point (decision 0073).
# Runners are not here: a runner is a computer with Docker that connects out to this server, and
# `aven` installs it beside the server or on any other machine. The server itself never starts
# sandboxes (AVEN_LOCAL_RUNNER is host or off in .env, never on).
#
#   cp env.example .env   # then fill it in; the installer does this for you
#   docker compose up -d
#
# Every install is a Docker project of its own, `aven-<short hash of AVEN_HOME>`, which `aven` passes
# with --project-name: a second install on the machine, a test one for instance, then never recreates
# or brings down this one's containers, nor its Postgres volume. Run by hand, the project is
# COMPOSE_PROJECT_NAME, else `aven` as it was before every install had a name of its own.
name: ${COMPOSE_PROJECT_NAME:-aven}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aven
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: aven
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aven -d aven"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    image: ${AVEN_SERVER_IMAGE:-ghcr.io/anvia-hq/aven-server}:${AVEN_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://aven:${POSTGRES_PASSWORD}@postgres:5432/aven
      AVEN_BROWSER_PORT: "8001"
      AVEN_BROWSER_BIND: 0.0.0.0
    # The API on this machine only: the runner beside the server and `aven` use it, whatever the
    # web entry point answers to. The Browser (decision 0199) is the same: a proxy on this machine
    # (`tailscale serve`, Caddy) gives it the address AVEN_BROWSER_ORIGIN names.
    ports:
      - "127.0.0.1:${AVEN_API_PORT:-2837}:8000"
      - "127.0.0.1:${AVEN_BROWSER_PORT:-2839}:8001"

  web:
    image: ${AVEN_WEB_IMAGE:-ghcr.io/anvia-hq/aven-web}:${AVEN_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      AVEN_SITE_ADDRESS: ${AVEN_SITE_ADDRESS:-:80}
    # HTTP, and HTTPS when AVEN_SITE_ADDRESS is a domain (Caddy then needs the standard 80 and 443
    # for its certificate). Without a domain nothing listens on 443, so that port stays on loopback.
    # AVEN_BIND is the address the HTTP port is published on: 127.0.0.1 is this machine only. Left
    # empty (or absent, as in a `.env` from before it existed) it is every address, as it was.
    ports:
      - "${AVEN_BIND:+${AVEN_BIND}:}${AVEN_PORT:-2836}:80"
      - "${AVEN_HTTPS_BIND:-127.0.0.1}:${AVEN_HTTPS_PORT:-2838}:443"
    volumes:
      - caddy_data:/data

volumes:
  postgres:
  caddy_data:
